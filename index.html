<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styg</title>
    <meta name="description" content="Styg — Danish metal band. Tour dates, photos and contact.">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Inlined Font Awesome brands subset (~1 KB). Eliminates an extra
         render-blocking request; the woff2 still loads with font-display: swap. -->
    <style>
        @font-face {
            font-family: "FA Brands";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("assets/fa-brands-400.woff2") format("woff2");
        }
        .fa-brands {
            font-family: "FA Brands", sans-serif;
            font-weight: 400;
            display: inline-block;
            font-style: normal;
            font-variant: normal;
            line-height: 1;
            text-rendering: auto;
            -webkit-font-smoothing: antialiased;
        }
        .fa-facebook-f::before { content: "\f39e"; }
        .fa-instagram::before  { content: "\f16d"; }
        .fa-tiktok::before     { content: "\e07b"; }
        .fa-youtube::before    { content: "\f167"; }
        .fa-spotify::before    { content: "\f1bc"; }
    </style>
    <!-- Preload the LCP image so the browser starts fetching it during HTML
         parse, not after router.js → home.js → hero.js eventually runs.
         imagesrcset/imagesizes pick the right size per viewport so phones
         don't download the 1920 desktop variant. -->
    <link rel="preload" as="image"
          href="assets/hero-image.webp"
          imagesrcset="assets/hero-image-800.webp 800w, assets/hero-image.webp 1920w"
          imagesizes="100vw"
          type="image/webp"
          fetchpriority="high">
    <!-- Logo overlays the hero and is now the LCP element on mobile;
         preload alongside the hero so neither waits for hero.js to run. -->
    <link rel="preload" as="image" href="assets/styg-logo.png" type="image/png" fetchpriority="high">
    <script defer type="module" src="js/router.js"></script>
</head>

<body class="site-wrapper">

    <div id="header-root"></div>

    <main class="site-content">
        <!-- Hero is in static HTML so it paints before any JS runs (big LCP
             win). It's a sibling of #content, so the router's clear-and-
             repopulate of #content doesn't touch it. router.js toggles its
             visibility per route. -->
        <section class="hero" id="hero">
            <div class="hero-wrapper">
                <img
                    src="assets/hero-image.webp"
                    srcset="assets/hero-image-800.webp 800w, assets/hero-image.webp 1920w"
                    sizes="100vw"
                    alt="Band photo"
                    class="hero-image"
                    width="1920"
                    height="1503"
                    fetchpriority="high"
                />
                <div class="hero-gradient"></div>
                <div class="hero-logo-overlay">
                    <img
                        src="assets/styg-logo.png"
                        alt="Styg Logo"
                        class="hero-logo"
                        width="1400"
                        height="793"
                        fetchpriority="high"
                    />
                </div>
            </div>
        </section>

        <div id="content">
            <!-- Page content injected here -->
        </div>
    </main>

    <div id="footer-root"></div>

</body>

</html>
